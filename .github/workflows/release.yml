name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  cli:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out: pzmm-windows-x64.exe
            bin: pzmm.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl # static: runs on any Linux server
            out: pzmm-linux-x64
            bin: pzmm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.target }} -p pzmm
      - run: mv target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
  app:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04] # 22.04: AppImage runs on older distros too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npx tauri build
        working-directory: app
        env: # signs the installers so installed copies accept them as updates
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
  publish:
    needs: [cli, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write latest.json (what installed copies check for updates)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import datetime, glob, json, os, re, sys
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          def entry(pattern):
              f = glob.glob(f"dist/**/{pattern}", recursive=True)[0]
              return f, {"signature": open(f + ".sig").read().strip(),
                         "url": f"https://github.com/{repo}/releases/download/{tag}/{os.path.basename(f)}"}
          win, win_entry = entry("*_x64-setup.exe")
          version = re.match(r"PZMM_(.+)_x64-setup\.exe", os.path.basename(win)).group(1)
          if tag != f"v{version}":
              sys.exit(f"tag {tag} doesn't match the app version {version}: bump Cargo.toml first")
          npm = json.load(open("app/package.json"))["version"]
          lock = json.load(open("app/package-lock.json"))["version"]
          if {npm, lock} != {version}:
              sys.exit(f"app/package.json ({npm}) and package-lock.json ({lock}) must both be {version}")
          json.dump({
              "version": version,
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": win_entry, "linux-x86_64": entry("*.AppImage")[1]},
          }, open("dist/latest.json", "w"), indent=2)
      # hand-written notes when docs/release-notes/<tag>.md exists, else GitHub's commit list.
      # Early access: every release is a draft pre-release until publicly launched (publish by hand).
      - run: |
          notes="docs/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then how=(--notes-file "$notes"); else how=(--generate-notes); fi
          find dist -type f && gh release create ${{ github.ref_name }} $(find dist -type f) --repo ${{ github.repository }} --draft --prerelease "${how[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
