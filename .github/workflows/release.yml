name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  cli:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out: pzmm-windows-x64.exe
            bin: pzmm.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl # static: runs on any Linux server
            out: pzmm-linux-x64
            bin: pzmm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.target }} -p pzmm
      - run: mv target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
  app:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04] # 22.04: AppImage runs on older distros too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx tauri build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
  publish:
    needs: [cli, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: find dist -type f && gh release create ${{ github.ref_name }} $(find dist -type f) --repo ${{ github.repository }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
