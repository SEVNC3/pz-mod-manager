<!doctype html>
<!-- The game opens only https pages, so PZMM - Client starts PZMM through this one: it opens pzmm://game, and
     the app reads the game's request file for what was asked. Drawn like the app: blueprint, skull, tape. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening PZMM</title>
<link rel="icon" href="pzmm-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212; --panel: #1a1a1a; --line: #2e2e2e; --text: #e8e8e6; --muted: #9b9b97;
    --tape: #e6d8ad; --tape-ink: #2a2823; --accent: #6e080c; --on-accent: #fff;
    --accent-text: #d0484e;
    --hover: color-mix(in oklab, var(--accent) 34%, transparent);
    --hover-line: color-mix(in oklab, var(--accent) 70%, transparent);
    --card-shadow: 0 1px 2px rgb(0 0 0 / 0.55), 0 8px 22px rgb(0 0 0 / 0.55);
    --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --font-marker: "Permanent Marker", "Segoe Print", "Segoe UI", cursive;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* the app's blueprint paper */
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    color: var(--text); font: 15px/1.55 var(--font-body);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgb(255 255 255 / 0.04), transparent 60%),
      linear-gradient(rgb(255 255 255 / 0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.09) 1px, transparent 1px),
      linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
    background-size: 100% 100%, 96px 96px, 96px 96px, 24px 24px, 24px 24px;
    background-position: 0 0, -1px -1px, -1px -1px, -1px -1px, -1px -1px;
  }
  main { width: 100%; max-width: 460px; display: grid; justify-items: center; gap: 28px; }
  /* the splash's skull, beating */
  .logo { position: relative; width: 132px; height: 132px; animation: beat 2s 0.4s infinite; }
  .logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .logo .hot { opacity: 0; animation: flare 2s 0.4s infinite; }
  @keyframes beat { 0%, 4%, 20%, 24%, 38%, 100% { scale: 1; } 12% { scale: 1.09; } 30% { scale: 1.063; } }
  @keyframes flare { 0%, 4%, 20%, 24%, 38%, 100% { opacity: 0; } 12% { opacity: 1; } 30% { opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) { .logo, .logo .hot { animation: none; } }
  .card { width: 100%; background: var(--panel); border-radius: 10px; box-shadow: var(--card-shadow); padding: 26px 24px 22px; }
  /* a section's tape, as My mods labels them */
  .tape {
    display: inline-block; margin: 0 0 16px -4px; padding: 3px 72px 1px 16px;
    font: 22px/1.3 var(--font-marker); letter-spacing: 0.02em; color: var(--tape-ink);
    background: url(blood.svg) right -10px center / auto 140% no-repeat, var(--tape);
    transform: rotate(-0.8deg);
    clip-path: polygon(0 8%, 3% 0, 6% 10%, 9% 1%, 100% 0, 98% 30%, 100% 55%, 97% 80%, 100% 100%, 4% 100%, 1% 88%, 3% 60%, 0 40%);
    box-shadow: 0 1px 0 rgb(0 0 0 / 0.15);
  }
  h1 { all: unset; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 6px;
    border: 1px solid transparent; color: inherit; text-decoration: none; font-weight: 700;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: color-mix(in oklab, var(--accent) 85%, white); }
  .btn.quiet { font-weight: 400; }
  .btn.quiet:hover { background: var(--hover); border-color: var(--hover-line); }
  .btn:focus-visible { outline: 2px solid rgb(255 255 255 / 0.85); outline-offset: 2px; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  footer { font-size: 12px; color: var(--muted); text-align: center; }
  footer a { color: var(--accent-text); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <img src="pzmm-logo.png" alt="">
    <img class="hot" src="pzmm-logo-hot.png" alt="">
  </div>
  <section class="card">
    <h1 class="tape">Opening PZMM</h1>
    <p>Project Zomboid asked PZMM to do something. If your browser asks, let it open PZMM.</p>
    <p class="muted">Once PZMM is open you can close this tab and go back to the game.</p>
    <div class="actions">
      <a class="btn primary" href="pzmm://game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open PZMM
      </a>
      <a class="btn quiet" href="https://github.com/SEVNC3/pz-mod-manager/releases/latest">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Don't have it? Download PZMM
      </a>
    </div>
  </section>
  <footer>PZMM Mod Manager for Project Zomboid · <a href="https://github.com/SEVNC3/pz-mod-manager">GitHub</a></footer>
</main>
<script>
  // the game's request file says what was asked: this page only wakes the app
  location.href = "pzmm://game";
</script>
</body>
</html>
